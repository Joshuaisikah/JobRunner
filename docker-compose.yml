services:
  db:
    image: postgres:17
    container_name: jobrunner-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobrunner
    ports:
      - "5433:5432"   # 5433 so it doesn't clash with your other projects' Postgres
    volumes:
      - jobrunner-pgdata:/var/lib/postgresql/data

volumes:
  jobrunner-pgdata:
